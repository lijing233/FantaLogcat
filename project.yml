name: FantaLogcat
options:
  deploymentTarget:
    macOS: "13.0"
  knownRegions: [en, zh-Hans]
settings:
  base:
    ARCHS: arm64
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: YES
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    MARKETING_VERSION: 1.0.13
    CURRENT_PROJECT_VERSION: 13
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.4
targets:
  FantaLogcat:
    type: application
    platform: macOS
    sources: [FantaLogcatApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.fantalogcat.FantaLogcat
        PRODUCT_NAME: FantaLogcat
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: FantaLogcatApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: FantaLogcatApp/FantaLogcat.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    dependencies:
      - package: Sparkle
  FantaLogcatTests:
    type: bundle.unit-test
    platform: macOS
    sources: [FantaLogcatTests]
    dependencies:
      - target: FantaLogcat
  FantaLogcatUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [FantaLogcatUITests]
    dependencies:
      - target: FantaLogcat
schemes:
  FantaLogcat:
    build:
      targets:
        FantaLogcat: all
        FantaLogcatTests: [test]
    test:
      targets: [FantaLogcatTests, FantaLogcatUITests]
