name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-release:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install Mint
        run: brew install mint

      - name: Install project tools
        run: mint bootstrap

      - name: Run CI checks
        run: make ci

      - name: Build release artifact
        run: make release

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: FantaLogcat-macos-arm64
          path: |
            build/releases/FantaLogcat-macos-arm64.zip
            build/releases/FantaLogcat-macos-arm64.zip.sha256
          if-no-files-found: error
