name: Feature request
description: Propose an improvement to FantaLogcat.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Debugging problem
      description: What debugging task is difficult today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Minimal desired outcome
      description: Describe the smallest useful result, not a complete implementation.
    validations:
      required: true
